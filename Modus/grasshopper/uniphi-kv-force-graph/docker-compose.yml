services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    env_file:
      - .env
    ports:
      - "${PORT:-5174}:5174"
    volumes:
      - ./:/app
      - /app/node_modules
    command: ["npm","run","dev","--","--host","0.0.0.0","--port","5174"]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8084}:80"
