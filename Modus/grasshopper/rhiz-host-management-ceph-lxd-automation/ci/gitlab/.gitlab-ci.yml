stages: [integrity, package]

integrity:
  stage: integrity
  image: alpine:3.20
  script:
    - apk add --no-cache bash python3
    - bash -n scripts/*.sh
    - python3 -m json.tool directives/host-management.directive.json >/dev/null

package:
  stage: package
  image: alpine:3.20
  script:
    - apk add --no-cache zip
    - zip -r rhiz-host-management-ceph-lxd-automation.zip .
  artifacts:
    paths:
      - rhiz-host-management-ceph-lxd-automation.zip
