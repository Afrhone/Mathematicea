services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      - mongo
      - redis
    ports:
      - "8078:8078"
    volumes:
      - ../../config:/app/config:ro
      - ../../data:/app/data

  agent-gateway:
    build:
      context: ../..
      dockerfile: apps/agent/Dockerfile
    env_file:
      - ../../.env
    ports:
      - "8080:8080"
    volumes:
      - ../../config:/app/config:ro

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      - api
    ports:
      - "8077:3000"

  mcp:
    build:
      context: ../..
      dockerfile: apps/mcp/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      - api
    ports:
      - "8091:8091"

  gnn-worker:
    build:
      context: ../..
      dockerfile: apps/gnn/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      - api
      - redis
    profiles: ["gnn"]

  eeg-bridge:
    build:
      context: ../..
      dockerfile: apps/eeg/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      - api
    ports:
      - "9001:9001"
    profiles: ["eeg"]

volumes:
  mongo-data:
