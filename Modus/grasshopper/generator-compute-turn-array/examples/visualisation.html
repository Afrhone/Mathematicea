<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Generator Compute Turn Array</title></head>
  <body>
    <canvas id="surface"></canvas>
    <script type="module">
      import * as THREE from 'https://esm.sh/three@0.164.1';
      import { createGeneratorComputeTurnArray } from '../src/index.js';
      const { samples } = createGeneratorComputeTurnArray({ turns: 96, radialSteps: 32 });
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
      camera.position.set(0, -16, 16);
      camera.lookAt(0, 0, 6);
      const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('#surface'), antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(samples.flatMap((s) => [s.cartesian.x, s.cartesian.y, s.cartesian.z]), 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(samples.flatMap((s) => [Math.abs(s.u8[1]), Math.abs(s.u8[4]), Math.abs(s.u8[5])]), 3));
      scene.add(new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.05, vertexColors: true })));
      renderer.render(scene, camera);
    </script>
  </body>
</html>
