services:
  model-gateway:
    image: node:20-bookworm
    working_dir: /app
    command: sh -c "npm install && npm start"
    env_file: ../.env
    volumes:
      - ../services/model_gateway:/app
    ports:
      - "${MODEL_GATEWAY_PORT:-7181}:7181"
    restart: unless-stopped
  mcp-bridge:
    image: node:20-bookworm
    working_dir: /app
    command: sh -c "npm install && npm start"
    env_file: ../.env
    volumes:
      - ../services/mcp:/app
    ports:
      - "${MCP_PORT:-7182}:7182"
    restart: unless-stopped
