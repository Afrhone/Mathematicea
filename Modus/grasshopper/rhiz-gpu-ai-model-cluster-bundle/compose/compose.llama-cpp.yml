services:
  llama-cpp:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggerganov/llama.cpp:server}
    container_name: rhiz-llama-cpp
    command:
      - "-m"
      - "${LLAMA_MODEL_PATH:-/models/default.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "${LLAMA_CTX:-4096}"
      - "-ngl"
      - "${LLAMA_NGL:-0}"
    ports:
      - "${LLAMA_CPP_PORT:-8080}:8080"
    volumes:
      - "${MODEL_ROOT:-/srv/models}:/models:ro"
    restart: unless-stopped
