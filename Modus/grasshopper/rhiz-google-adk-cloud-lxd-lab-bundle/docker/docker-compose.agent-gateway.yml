services:
  agent-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent-gateway
    container_name: rhiz-adk-agent-gateway
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${AGENT_GATEWAY_PORT:-8099}:8099"
    volumes:
      - ../config:/app/config:ro
      - ../state:/app/state
      - ../logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - redis
      - mongo
  mcp-tools:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent-gateway
    container_name: rhiz-adk-mcp-tools
    restart: unless-stopped
    env_file:
      - ../.env
    command: ["python", "-m", "rhiz_adk_lab.mcp_server"]
    ports:
      - "${MCP_PORT:-8097}:8097"
    volumes:
      - ../config:/app/config:ro
      - ../state:/app/state
      - /var/run/docker.sock:/var/run/docker.sock:ro
  redis:
    image: redis:7-alpine
    container_name: rhiz-adk-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
  mongo:
    image: mongo:7
    container_name: rhiz-adk-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
volumes:
  redis_data:
  mongo_data:
