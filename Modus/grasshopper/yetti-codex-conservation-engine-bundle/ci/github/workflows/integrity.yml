name: yetti-codex-integrity
on: [push, pull_request, workflow_dispatch]
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/*.sh scripts/scout/*.sh scripts/codex/*.sh scripts/ledger/*.sh
      - run: python3 -m json.tool directives/yetti-codex.directive.json >/dev/null
      - run: cp config/yetti-codex.env.example .env && docker compose -f compose/compose.yetti-codex.yml config >/dev/null
