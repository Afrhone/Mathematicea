stages:
  - integrity
  - package

integrity:
  stage: integrity
  image: docker:27
  services:
    - docker:27-dind
  script:
    - apk add --no-cache bash python3 docker-cli-compose
    - python3 -m compileall metrology_lab/app agent gateway
    - bash -n scripts/*.sh
    - bash -n cluster/*/*.sh
    - bash -n handshake/*.sh
    - docker compose config

package:
  stage: package
  image: alpine:3.20
  script:
    - apk add --no-cache zip
    - zip -r rhizome-metrology-bundle.zip .
  artifacts:
    paths:
      - rhizome-metrology-bundle.zip
