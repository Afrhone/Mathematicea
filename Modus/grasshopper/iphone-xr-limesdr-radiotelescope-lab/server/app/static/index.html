<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPhone XR LimeSDR Observatory</title>
<style>
body{margin:0;background:#050713;color:#dff;font-family:ui-monospace,Menlo,monospace}header{padding:18px 22px;background:linear-gradient(90deg,#0b1028,#172044,#060713)}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;padding:16px}.card{border:1px solid #28426b;border-radius:18px;background:rgba(12,20,45,.75);box-shadow:0 0 40px rgba(60,150,255,.12);padding:16px}img{width:100%;border-radius:14px}.metric{white-space:pre-wrap;color:#bde}canvas{width:100%;height:420px;border-radius:18px;background:#000}.pill{display:inline-block;padding:6px 10px;border:1px solid #4ca3ff;border-radius:999px;margin:4px;color:#acf}</style>
</head><body><header><h1>RHIZ Observatory · iPhone XR + LimeSDR</h1><span class="pill">video</span><span class="pill">sensor telemetry</span><span class="pill">spectrogram</span><span class="pill">lens compute</span><span class="pill">MCP</span></header>
<div class="grid"><section class="card"><canvas id="space"></canvas></section><section class="card"><h2>Live Radio Spectrogram</h2><img id="spec" src="/api/spectrogram.png"><h2>Telemetry</h2><pre id="tele" class="metric">loading...</pre><h2>Lens Metrics</h2><pre id="lens" class="metric">loading...</pre></section></div>
<script>
const c=document.getElementById('space'),gl=c.getContext('webgl2');function resize(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;gl.viewport(0,0,c.width,c.height)}addEventListener('resize',resize);resize();
const vs=`#version 300 es
precision highp float; const int N=2400; uniform float t; out vec3 v; void main(){int i=gl_VertexID; float a=float(i)*2.399963; float z=1.-2.*(float(i)/float(N)); float r=sqrt(max(0.,1.-z*z)); vec3 p=vec3(r*cos(a+t*.08),r*sin(a+t*.07),z); float w=sin(float(i)*.017+t)*.08; p+=normalize(p)*w; gl_Position=vec4(p.xy*.82,p.z*.2,1); gl_PointSize=1.7+4.*abs(w); v=.5+.5*p;}`;
const fs=`#version 300 es
precision highp float; in vec3 v; out vec4 o; void main(){float d=length(gl_PointCoord-.5); if(d>.5) discard; o=vec4(v.x*.6+.2,v.y*.9+.1,1.,1.-smoothstep(.25,.5,d));}`;
function sh(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s}let pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);let loc=gl.getUniformLocation(pr,'t');function draw(ms){gl.clearColor(.02,.03,.08,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform1f(loc,ms/1000);gl.drawArrays(gl.POINTS,0,2400);requestAnimationFrame(draw)}draw(0);
async function tick(){document.getElementById('spec').src='/api/spectrogram.png?x='+Date.now();document.getElementById('tele').textContent=JSON.stringify(await (await fetch('/api/telemetry/latest')).json(),null,2);document.getElementById('lens').textContent=JSON.stringify(await (await fetch('/api/lens')).json(),null,2)}tick();setInterval(tick,2500);
</script></body></html>
