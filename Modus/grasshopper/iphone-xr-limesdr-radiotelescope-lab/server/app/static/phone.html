<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Feed</title><style>body{background:#050713;color:#e8ffff;font-family:system-ui;padding:18px}video{width:100%;border-radius:18px;background:#000}button,input{font-size:16px;padding:12px;margin:8px;border-radius:12px}.log{white-space:pre-wrap;background:#101a35;padding:12px;border-radius:12px}</style></head><body><h1>iPhone XR Sensor + Video Feed</h1><p>Use Wi‑Fi for camera and sensors. Keep screen awake. Bluetooth SDR transport is not practical on iOS Safari; server-side LimeSDR is the primary radio path.</p><input id="token" placeholder="PHONE_SHARED_TOKEN"><button onclick="start()">Start Phone Feed</button><video id="v" autoplay playsinline muted></video><pre id="log" class="log"></pre><script>
const log=x=>document.getElementById('log').textContent=JSON.stringify(x,null,2);let ws,stream;
async function start(){const token=document.getElementById('token').value;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});document.getElementById('v').srcObject=stream;ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws/phone');ws.onmessage=e=>log(JSON.parse(e.data));
if(DeviceMotionEvent&&DeviceMotionEvent.requestPermission){try{await DeviceMotionEvent.requestPermission()}catch(e){}}
setInterval(()=>sendTelemetry(token),500);}
let lastMotion={},lastOri={};addEventListener('devicemotion',e=>{lastMotion={acceleration:e.acceleration,accelerationIncludingGravity:e.accelerationIncludingGravity,rotationRate:e.rotationRate,interval:e.interval}});addEventListener('deviceorientation',e=>{lastOri={alpha:e.alpha,beta:e.beta,gamma:e.gamma,absolute:e.absolute}});
async function sendTelemetry(token){let battery={};try{if(navigator.getBattery)battery=await navigator.getBattery().then(b=>({level:b.level,charging:b.charging}))}catch(e){}let data={ts:Date.now()/1000,orientation:lastOri,motion:lastMotion,battery,network:{type:navigator.connection?.effectiveType||null}};if(ws&&ws.readyState===1)ws.send(JSON.stringify(data));fetch('/api/phone/telemetry',{method:'POST',headers:{'content-type':'application/json','x-phone-token':token},body:JSON.stringify(data)}).catch(()=>{});}
</script></body></html>
