version: "3.9"
services:
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
    networks: [rhiz]
  gateway:
    image: rhiz/reheboam-gateway:local
    environment:
      MONGO_URL: mongodb://mongo:27017/rhiz_rehoboam
      GATEWAY_PORT: 8787
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://llama-cpp:8080/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local-rhiz}
    ports: ["8787:8787"]
    networks: [rhiz]
    deploy: { placement: { constraints: ["node.labels.rhiz.gateway == true"] } }
  web:
    image: rhiz/reheboam-web:local
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://gateway:8787
    ports: ["3000:3000"]
    networks: [rhiz]
volumes: { mongo_data: {} }
networks: { rhiz: { driver: overlay } }
