server {
  listen 80;
  server_name ai.sigmo-rhiz.local;
  location / { proxy_pass http://127.0.0.1:3033; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /api/ { proxy_pass http://127.0.0.1:8099/; }
  location /v1/ { proxy_pass http://127.0.0.1:8099/v1/; }
  location /mcp/ { proxy_pass http://127.0.0.1:8787/mcp/; }
}
