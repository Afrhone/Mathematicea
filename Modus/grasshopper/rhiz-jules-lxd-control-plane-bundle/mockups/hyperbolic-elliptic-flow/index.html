<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>RHIZ Vertical Hyperbolic/Elliptic Flow</title><style>html,body{margin:0;height:100%;background:#05060b;color:#eaf7ff;font-family:ui-monospace,Menlo,monospace;overflow:hidden}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;left:16px;top:16px;max-width:520px;background:rgba(3,8,18,.72);border:1px solid rgba(120,220,255,.35);border-radius:18px;padding:14px 16px;box-shadow:0 0 32px rgba(40,180,255,.12)}.hud h1{font-size:15px;margin:0 0 8px}.hud p{font-size:12px;line-height:1.45;margin:6px 0;color:#bad9e8}.tag{display:inline-block;margin:3px 4px 0 0;padding:2px 7px;border-radius:999px;border:1px solid rgba(255,255,255,.2);font-size:11px;color:#dff}</style></head><body><canvas id="c"></canvas><div class="hud"><h1>RHIZ Jules × GitLab × LXD — vertical flow</h1><p>Vertical axis = authority depth. Hyperbolic spread = branch expansion. Elliptic rings = release/validation cycles. Red pulses = invariant drift.</p><span class="tag">GitLab canonical</span><span class="tag">GitHub/Jules adapter</span><span class="tag">LXD bridge</span><span class="tag">Gateway gate</span><span class="tag">MCP/model routes</span></div><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let t=0;function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();const nodes=[['GitLab canonical',0,-260,'authority'],['GitHub mirror',-120,-170,'adapter'],['Jules source/session',120,-170,'agent'],['jules-bridge LXC',0,-60,'local'],['LXD dev VM/LXC',-150,35,'compute'],['Gateway token broker',150,35,'gate'],['MCP / Ollama / Llama',0,145,'data'],['Validated envelope',0,250,'release']];const edges=[[0,1],[1,2],[2,3],[3,4],[3,5],[5,6],[4,6],[6,7]];function project(x,y,k=1){let cx=innerWidth/2,cy=innerHeight/2,warp=1/(1+Math.abs(y)/620);return[cx+x*warp*k,cy+y,warp]}function draw(){t+=.012;ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#05060b';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.save();ctx.globalAlpha=.32;for(let r=70;r<420;r+=42){ctx.beginPath();ctx.ellipse(innerWidth/2,innerHeight/2,r*1.38,r*.38,Math.sin(t)*.06,0,Math.PI*2);ctx.strokeStyle='rgba(80,210,255,.18)';ctx.stroke()}ctx.restore();edges.forEach(([a,b],i)=>{let A=nodes[a],B=nodes[b],p1=project(A[1]+Math.sin(t+i)*8,A[2]),p2=project(B[1]+Math.cos(t+i)*8,B[2]),pulse=(Math.sin(t*3+i)+1)/2;ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.bezierCurveTo(p1[0],p1[1]+55,p2[0],p2[1]-55,p2[0],p2[1]);ctx.strokeStyle=`rgba(${80+120*pulse},${180+50*pulse},255,.45)`;ctx.lineWidth=1.5+pulse;ctx.stroke()});nodes.forEach((n,i)=>{let phase=t+i*.7,hyper=Math.sinh(Math.sin(phase)*.11)*90,p=project(n[1]+hyper,n[2]),risk=n[3]=='gate'?(Math.sin(t*4)+1)/2:0;ctx.beginPath();ctx.arc(p[0],p[1],12+6*p[2]+risk*4,0,Math.PI*2);ctx.fillStyle=risk>.75?'rgba(255,80,120,.9)':'rgba(120,235,255,.85)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.55)';ctx.stroke();ctx.fillStyle='#eaf7ff';ctx.font='12px ui-monospace';ctx.fillText(n[0],p[0]+18,p[1]+4)});ctx.fillStyle='rgba(180,230,255,.55)';ctx.font='12px ui-monospace';ctx.fillText('score(path)=progress−cost−branch_drift−phase_error−invariant_drift−secret_risk',18,innerHeight-24);requestAnimationFrame(draw)}draw();
</script></body></html>
