services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    env_file:
      - .env
    ports:
      - "${PORT:-5173}:5173"
    volumes:
      - ./:/app
      - /app/node_modules
    command: ["npm","run","dev","--","--host","0.0.0.0","--port","5173"]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
