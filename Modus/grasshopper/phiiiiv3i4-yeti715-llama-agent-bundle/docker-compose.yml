services:
  agent-api:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r agent_api/requirements.txt && uvicorn agent_api.src.main:app --host ${AGENT_BIND:-0.0.0.0} --port ${AGENT_PORT:-7175}"
    env_file:
      - .env
    volumes:
      - ./:/app
      - ${AGENT_DATA_ROOT:-/var/lib/yeti715-agent}:${AGENT_DATA_ROOT:-/var/lib/yeti715-agent}
    ports:
      - "${AGENT_PORT:-7175}:${AGENT_PORT:-7175}"
    restart: unless-stopped

  # Optional local Ollama bridge assumes Ollama runs on host at 11434.
  # Optional llama.cpp assumes llama-server runs on host at 8080.
