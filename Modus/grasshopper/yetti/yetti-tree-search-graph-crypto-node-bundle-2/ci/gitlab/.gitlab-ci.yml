stages: [integrity]
integrity:
  stage: integrity
  image: docker:27
  services: [docker:27-dind]
  script:
    - apk add --no-cache bash python3 docker-cli-compose
    - bash -n automation/gates/*.sh
    - python3 -m json.tool genesis/genesis.yetti.json >/dev/null
    - cp .env.example .env
    - docker compose -f compose/compose.yetti-node.yml config >/dev/null
