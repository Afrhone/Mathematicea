<!doctype html><html><head><meta charset="utf-8"/><title>YETTI Node</title><style>body{margin:0;background:#061018;color:#e9fbff;font-family:system-ui}#hud{position:fixed;top:16px;left:16px;max-width:460px;background:rgba(0,0,0,.65);border:1px solid #aef;padding:16px;border-radius:12px}canvas{width:100vw;height:100vh;display:block}button{margin:4px;padding:8px;border-radius:8px}pre{white-space:pre-wrap;font-size:12px}</style></head><body><canvas id="c"></canvas><div id="hud"><h1>YETTI Tree Search Node</h1><p>Snow Credits · Automation Worlds · Graph Gate</p><button onclick="loadGraph()">Graph</button><button onclick="search()">Run Tree Search</button><pre id="out"></pre></div><script>
const NODE='http://127.0.0.1:7215';const c=document.getElementById('c'),ctx=c.getContext('2d');let graph={nodes:[],edges:[]};function resize(){c.width=innerWidth;c.height=innerHeight}addEventListener('resize',resize);resize();
async function loadGraph(){graph=await fetch(NODE+'/graph').then(r=>r.json());out.textContent=JSON.stringify(graph.genesis,null,2)}
async function search(){const r=await fetch(NODE+'/tree/search',{method:'POST',headers:{'content-type':'application/json'},body:'{}'}).then(r=>r.json());out.textContent=JSON.stringify(r,null,2)}
function draw(){ctx.clearRect(0,0,c.width,c.height);const nodes=(graph.nodes||[]).map(n=>n.id);const pos={};nodes.forEach((n,i)=>{const a=i/nodes.length*Math.PI*2;pos[n]={x:c.width/2+Math.cos(a)*260,y:c.height/2+Math.sin(a)*260}});ctx.strokeStyle='#8df';ctx.fillStyle='#e9fbff';ctx.font='14px system-ui';for(const e of graph.edges||[]){const a=pos[e.source],b=pos[e.target];if(!a||!b)continue;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.fillText(e.kind,(a.x+b.x)/2,(a.y+b.y)/2)}for(const n of nodes){const p=pos[n];ctx.beginPath();ctx.arc(p.x,p.y,22,0,Math.PI*2);ctx.fillStyle='#0c2a3a';ctx.fill();ctx.strokeStyle='#bff';ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(n,p.x+26,p.y+4)}requestAnimationFrame(draw)}loadGraph();draw();
</script></body></html>
