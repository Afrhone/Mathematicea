services:
  llama-cpp-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /srv/ollama/models:/models:ro
    command:
      - -m
      - /models/your-model.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --n-gpu-layers
      - "999"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
