stages: [integrity, package]

integrity:
  stage: integrity
  image: docker:27
  services: [docker:27-dind]
  script:
    - apk add --no-cache bash python3 docker-cli-compose
    - bash -n scripts/*.sh
    - bash -n cluster/*/*.sh
    - bash -n automation/crashtest/*.sh
    - python3 -m compileall eeg_bridge simulation
    - docker compose config

package:
  stage: package
  image: alpine:3.20
  script:
    - apk add --no-cache zip
    - zip -r functor-arvr-eeg-reality-lab.zip .
  artifacts:
    paths: [functor-arvr-eeg-reality-lab.zip]
