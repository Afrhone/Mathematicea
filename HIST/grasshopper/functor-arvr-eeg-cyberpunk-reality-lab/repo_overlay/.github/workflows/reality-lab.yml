name: reality-lab

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n scripts/*.sh
          bash -n cluster/*/*.sh
          bash -n automation/crashtest/*.sh
      - name: Python syntax
        run: |
          python3 -m compileall eeg_bridge simulation
      - name: Compose config
        run: docker compose config
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: functor-arvr-eeg-reality-lab
          path: .
