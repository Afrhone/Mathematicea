stages: [integrity, package]

integrity:
  stage: integrity
  image: docker:27
  services: [docker:27-dind]
  script:
    - apk add --no-cache bash python3 py3-pip docker-cli-compose
    - python3 -m compileall agent_api
    - bash -n scripts/*.sh
    - bash -n summon/*.sh
    - bash -n lxd/*.sh
    - docker compose config

package:
  stage: package
  image: alpine:3.20
  script:
    - apk add --no-cache zip
    - zip -r phiiiiv3i4-yeti715-agent-bundle.zip .
  artifacts:
    paths: [phiiiiv3i4-yeti715-agent-bundle.zip]
