    <text x="1022.0" y="420.6" text-anchor="middle" class="ndesc">Normality, Inference</text>
  </g>
  <g class="node">
    <circle cx="1155.2" cy="537.6" r="44" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.18)"/>
    <text x="1155.2" y="531.6" text-anchor="middle" class="nlabel">Fluid Dynamics</text>
    <text x="1155.2" y="551.6" text-anchor="middle" class="ndesc">Advection, Vorticity</text>
  </g>
  <g class="node">
    <circle cx="1030.6" cy="657.0" r="44" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.18)"/>
    <text x="1030.6" y="651.0" text-anchor="middle" class="nlabel">Chaos/Noise</text>
    <text x="1030.6" y="671.0" text-anchor="middle" class="ndesc">Turbulence, Forcing</text>
  </g>
  <g class="node">
    <circle cx="900.7" cy="702.5" r="44" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.18)"/>
    <text x="900.7" y="696.5" text-anchor="middle" class="nlabel">Chemistry</text>
    <text x="900.7" y="716.5" text-anchor="middle" class="ndesc">Kinetics, Catalysis</text>
  </g>
  <g class="node">
    <circle cx="829.7" cy="870.2" r="52" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.18)"/>
    <text x="829.7" y="864.2" text-anchor="middle" class="nlabel">Molecular Mechanics</text>
    <text x="829.7" y="884.2" text-anchor="middle" class="ndesc">Force Fields, PES</text>
  </g>
  <g class="node">
    <circle cx="673.3" cy="855.9" r="44" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.18)"/>
    <text x="673.3" y="849.9" text-anchor="middle" class="nlabel">Quantum MD</text>
    <text x="673.3" y="869.9" text-anchor="middle" class="ndesc">Phase, Superposition</text>
  </g>
  <g class="node">
