name: rhizome-metrology

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m compileall metrology_lab/app agent gateway
      - name: Shell syntax
        run: |
          bash -n scripts/*.sh
          bash -n cluster/*/*.sh
          bash -n handshake/*.sh
      - name: Compose config
        run: docker compose config
      - name: Archive bundle
        uses: actions/upload-artifact@v4
        with:
          name: rhizome-metrology-bundle
          path: .
