stages: [integrity, package]
integrity:
  stage: integrity
  image: docker:27
  services: [docker:27-dind]
  script:
    - apk add --no-cache bash docker-cli-compose
    - bash -n automation/gates/*.sh
    - bash -n automation/scripts/*.sh
    - docker compose config
package:
  stage: package
  image: alpine:3.20
  script:
    - apk add --no-cache zip
    - zip -r octopuce-medusa-hyperledger-dao-organism.zip .
  artifacts:
    paths: [octopuce-medusa-hyperledger-dao-organism.zip]
