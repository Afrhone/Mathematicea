<!doctype html><html><head><meta charset="utf-8"/><title>Exosys MCP Cloud CPU Hub</title><style>body{margin:0;background:#060812;color:#e9f6ff;font-family:system-ui}#hud{position:fixed;left:16px;top:16px;background:rgba(0,0,0,.65);padding:16px;border:1px solid #44d9ff;border-radius:12px;max-width:440px}canvas{display:block;width:100vw;height:100vh}button{margin:4px;padding:8px;border-radius:8px}pre{font-size:12px;white-space:pre-wrap}</style></head><body><canvas id="c"></canvas><div id="hud"><h1>Exosys eno8303 Hub</h1><p>Live topology · label swap · MCP CPU lane · cloud gateways</p><button onclick="load()">Refresh</button><button onclick="labelSwap()">Dry-run Label Swap</button><pre id="out"></pre></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let topo={nodes:[],edges:[]};function resize(){c.width=innerWidth;c.height=innerHeight}addEventListener('resize',resize);resize();
async function load(){const token=localStorage.adminToken||prompt('ADMIN_TOKEN?');localStorage.adminToken=token;topo=await fetch('/api/topology',{headers:{authorization:'Bearer '+token}}).then(r=>r.json());out.textContent=JSON.stringify(topo,null,2)}
async function labelSwap(){const token=localStorage.adminToken;const r=await fetch('/api/control/label-swap',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({label:topo.labelSwap,action:'preview'})}).then(r=>r.json());out.textContent=JSON.stringify(r,null,2)}
function draw(){ctx.clearRect(0,0,c.width,c.height);const nodes=[...new Set([...topo.nodes.map(n=>n.id),...topo.edges.flatMap(e=>[e.source,e.target])])];const pos={};nodes.forEach((n,i)=>{const a=i/nodes.length*Math.PI*2;pos[n]={x:c.width/2+Math.cos(a)*Math.min(c.width,c.height)*.32,y:c.height/2+Math.sin(a)*Math.min(c.width,c.height)*.32}});ctx.lineWidth=2;ctx.strokeStyle='#37d4ff';ctx.fillStyle='#e9f6ff';ctx.font='14px system-ui';for(const e of topo.edges){const a=pos[e.source],b=pos[e.target];if(!a||!b)continue;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.fillText(e.kind,(a.x+b.x)/2,(a.y+b.y)/2)}for(const n of nodes){const p=pos[n];ctx.beginPath();ctx.arc(p.x,p.y,18,0,Math.PI*2);ctx.fillStyle='#0b2940';ctx.fill();ctx.strokeStyle='#9af7ff';ctx.stroke();ctx.fillStyle='#e9f6ff';ctx.fillText(n,p.x+22,p.y+4)}requestAnimationFrame(draw)}load().catch(console.error);draw();
</script></body></html>
