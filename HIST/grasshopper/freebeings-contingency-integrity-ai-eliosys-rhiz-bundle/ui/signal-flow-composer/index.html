<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freebeings Signal Flow Composer</title>
<style>
html,body{margin:0;height:100%;background:#080910;color:#e9f4ff;font-family:system-ui,Segoe UI,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;left:16px;top:16px;max-width:420px;background:rgba(8,9,16,.72);border:1px solid rgba(150,220,255,.25);border-radius:18px;padding:14px;backdrop-filter:blur(12px)}.hud h1{font-size:18px;margin:0 0 8px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:rgba(100,200,255,.12);border:1px solid rgba(100,200,255,.25);margin:2px;font-size:12px}.right{position:fixed;right:16px;top:16px;width:320px;background:rgba(8,9,16,.72);border:1px solid rgba(255,200,120,.24);border-radius:18px;padding:14px}textarea{width:100%;height:110px;background:#0d1220;color:#e9f4ff;border:1px solid #25324b;border-radius:12px;padding:8px}button{background:#15213a;color:#e9f4ff;border:1px solid #37517e;border-radius:12px;padding:8px 10px;margin:4px 4px 0 0}.nodeLabel{position:absolute;pointer-events:none;font-size:12px;color:#dff}</style></head>
<body><canvas id="c"></canvas>
<div class="hud"><h1>Freebeings Hyperbolic × Elliptic Signal Flow</h1><div><span class="pill">Stem</span><span class="pill">Integrity</span><span class="pill">Compost</span><span class="pill">Ferment</span><span class="pill">Canon</span><span class="pill">llama-gpu</span></div><p>Keyboard: arrows move focus, space promotes. Gamepad: left stick moves, A promotes, B blocks.</p><p id="status">initializing</p></div>
<div class="right"><b>Notepad Feed Composer</b><textarea id="note" placeholder="Drop raw note, bookmark, contradiction, panic trace, or agent task..."></textarea><button id="add">Add card</button><button id="rank">Rank</button><button id="panic">Panic reset</button><pre id="out"></pre></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,focus=0,t=0;function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
let nodes=['raw','compost','ferment','wiki','canon','Stem','Integrity','PHI|OS','/rhiz','/hypergraph','/cloud-compute','llama-gpu','camera','NVMe','panic-known-good'].map((name,i)=>({name,i,r:80+Math.random()*260,a:i*.77,v:0,score:.4+Math.random()*.5,state:i<5?'metabolic':'control'}));
let edges=[];for(let i=0;i<nodes.length;i++)edges.push([i,(i+1)%nodes.length]);edges.push([0,5],[5,6],[6,10],[10,11],[13,4],[14,6],[8,9],[9,10],[7,10]);
function pos(n){let cx=innerWidth/2,cy=innerHeight/2;let hyp=Math.tanh(n.r/260)*Math.min(cx,cy)*.82;let ell=28*Math.sin(t*.02+n.i);return [cx+Math.cos(n.a+t*.001)*hyp+ell,cy+Math.sin(n.a+t*.001)*hyp-ell]}
function draw(){t++;x.clearRect(0,0,innerWidth,innerHeight);let g=x.createRadialGradient(innerWidth/2,innerHeight/2,10,innerWidth/2,innerHeight/2,Math.max(innerWidth,innerHeight)/1.3);g.addColorStop(0,'#101b35');g.addColorStop(1,'#05060a');x.fillStyle=g;x.fillRect(0,0,innerWidth,innerHeight);x.lineWidth=1;for(const [a,b] of edges){let A=pos(nodes[a]),B=pos(nodes[b]);x.strokeStyle='rgba(120,210,255,.18)';x.beginPath();x.moveTo(...A);x.quadraticCurveTo(innerWidth/2,innerHeight/2,...B);x.stroke()}nodes.forEach((n,i)=>{let [px,py]=pos(n);let rad=i===focus?18:10+18*n.score;x.beginPath();x.arc(px,py,rad,0,Math.PI*2);x.fillStyle=n.state==='metabolic'?'rgba(110,255,170,.78)':'rgba(180,150,255,.76)';x.fill();x.strokeStyle=i===focus?'#fff':'rgba(255,255,255,.2)';x.stroke();x.fillStyle='#e9f4ff';x.font='12px system-ui';x.fillText(n.name,px+rad+4,py+4)});document.getElementById('status').textContent='focus='+nodes[focus].name+' | score='+nodes[focus].score.toFixed(2)+' | gamepad='+ (navigator.getGamepads?.()[0]?.id||'none');requestAnimationFrame(draw)}draw();
function promote(){nodes[focus].score=Math.min(1,nodes[focus].score+.08);document.getElementById('out').textContent='promoted '+nodes[focus].name+' with reversible ledger intent'}function block(){nodes[focus].score=Math.max(0,nodes[focus].score-.12);document.getElementById('out').textContent='blocked '+nodes[focus].name+' by Stem stop-flow'}
addEventListener('keydown',e=>{if(e.key==='ArrowRight')focus=(focus+1)%nodes.length;if(e.key==='ArrowLeft')focus=(focus-1+nodes.length)%nodes.length;if(e.key===' ')promote();if(e.key==='Escape')block()});
document.getElementById('add').onclick=()=>{let v=document.getElementById('note').value.trim();if(v){nodes.push({name:v.slice(0,18),i:nodes.length,r:120+Math.random()*240,a:Math.random()*6.28,score:.5,state:'metabolic'});edges.push([0,nodes.length-1]);document.getElementById('note').value=''}};document.getElementById('rank').onclick=()=>document.getElementById('out').textContent=nodes.slice().sort((a,b)=>b.score-a.score).map(n=>n.name+' '+n.score.toFixed(2)).join('\n');document.getElementById('panic').onclick=()=>{focus=nodes.findIndex(n=>n.name==='panic-known-good');document.getElementById('out').textContent='panic routed to known-good basin'};
setInterval(()=>{let gp=navigator.getGamepads?.()[0];if(!gp)return;if(Math.abs(gp.axes[0])>.5)focus=(focus+(gp.axes[0]>0?1:-1)+nodes.length)%nodes.length;if(gp.buttons[0]?.pressed)promote();if(gp.buttons[1]?.pressed)block();},180);
</script></body></html>
