services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-edge
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "3m"

  metabolic-agent:
    build:
      context: ..
      dockerfile: docker/metabolic-agent.Dockerfile
    container_name: freebeings-metabolic-agent
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      EDGE_MODEL: llama3.2:3b
    volumes:
      - ../data:/app/data
      - ../env:/app/env:ro
      - ../directives:/app/directives:ro

volumes:
  ollama:
