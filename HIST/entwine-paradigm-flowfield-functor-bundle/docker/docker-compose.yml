name: entwine-flowfield-functor

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  sdr-bridge:
    build: ../services/sdr-bridge
    restart: unless-stopped
    ports: ["8122:8122"]
    environment:
      - PORT=8122
      - FACTAU_SDR_URL=http://192.168.0.4:8099/spectrum

  api:
    build: ../services/api
    restart: unless-stopped
    ports: ["8121:8121"]
    environment:
      - PORT=8121
      - REDIS_URL=redis://redis:6379/0
      - SDR_BRIDGE_URL=http://sdr-bridge:8122
    volumes:
      - ../configs:/configs:ro
    depends_on: [redis, sdr-bridge]

  agent:
    build: ../services/agent
    restart: unless-stopped
    ports: ["8123:8123"]
    environment:
      - PORT=8123
      - API_URL=http://api:8121
      - LOCAL_OPENAI_BASE_URL=${LOCAL_OPENAI_BASE_URL:-http://192.168.0.125:8089/v1}
    depends_on: [api]

  ui:
    build: ../app
    restart: unless-stopped
    ports: ["8120:80"]
    depends_on: [api, sdr-bridge, agent]
