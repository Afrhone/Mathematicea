<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Standalone Geospatial Live Visualisation</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui;background:radial-gradient(circle at 20% 10%,#16475a,transparent 32%),#03080c;color:#e9fbff}.shell{width:min(1400px,96vw);margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end}h1{font-size:clamp(32px,6vw,68px);line-height:.92;letter-spacing:-.06em;margin:0}.sub{color:#8fb7c0}.grid{display:grid;grid-template-columns:310px 1fr;gap:16px}.panel,.map{border:1px solid rgba(164,245,255,.18);background:rgba(12,27,34,.82);border-radius:24px;box-shadow:0 24px 80px #0008}.panel{padding:16px;display:grid;gap:12px}.map{position:relative;min-height:720px;overflow:hidden}canvas{display:block;width:100%;height:100%;background:#02090e}select,input,textarea,button{width:100%;border-radius:14px;border:1px solid #ffffff22;background:#02080ccc;color:#e9fbff;padding:10px;font:inherit}button{cursor:pointer;background:linear-gradient(135deg,#87f8ff33,#ff9bd526)}.hud{position:absolute;left:16px;right:16px;bottom:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.hud div{background:#000c1299;border:1px solid #a4f5ff2e;border-radius:18px;padding:10px}.hud span{display:block;color:#8fb7c0;font-size:11px;text-transform:uppercase}.hud strong{font-size:18px}@media(max-width:900px){.grid{grid-template-columns:1fr}.map{min-height:520px}.hud{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="shell"><section class="top"><div><p class="sub">standalone · offline-first · live mock stream</p><h1>Geospatial flux lattice</h1><p class="sub">Canvas map with live telemetry pulses, vector field, thermal/kinetic/curl/entropy overlays.</p></div><button id="pause">Pause</button></section><section class="grid"><aside class="panel"><label>Projection<select id="proj"><option value="equirect">Equirectangular</option><option value="mercator">Mercator</option><option value="ortho">Orthographic</option></select></label><label>Layer<select id="layer"><option value="flux">Flux</option><option value="thermal">Thermal</option><option value="kinetic">Kinetic</option><option value="curl">Curl</option><option value="entropy">Entropy</option></select></label><label>Rate <span id="rateText">12 Hz</span><input id="rate" type="range" min="1" max="60" value="12"/></label><label>Gain <span id="gainText">1.00</span><input id="gain" type="range" min="0" max="300" value="100"/></label><button id="geo">Use browser geolocation</button><textarea id="nd" rows="7" placeholder='Paste NDJSON telemetry here'></textarea><button id="ingest">Ingest NDJSON</button></aside><section class="map"><canvas id="c"></canvas><div class="hud"><div><span>events</span><strong id="events">0</strong></div><div><span>L-energy</span><strong id="energy">0</strong></div><div><span>entropy</span><strong id="entropy">0</strong></div><div><span>curl</span><strong id="curl">0</strong></div></div></section></section></main><script>
const DEG=Math.PI/180,TAU=Math.PI*2;const $=id=>document.getElementById(id);const c=$('c'),ctx=c.getContext('2d');let running=true,rate=12,lastEmit=0,buf=[],view={lon:0,lat:18,zoom:1},drag=null,geoWatch=null;const seeds=[['bern-rhiz',46.948,7.447,286,.4],['europa-proxy',63,-45,241,-.2],['ceres-compass',14.6,-87.1,300,.7],['ganymede-node',-23.5,133.8,294,.1],['io-pulse',35.7,139.7,291,1.1],['deimos-conj',40.4,-3.7,289,-.5]];const land=[[[-168,72],[-130,70],[-105,55],[-82,48],[-65,36],[-82,18],[-100,18],[-118,32],[-140,50],[-168,72]],[[-82,12],[-68,8],[-52,-8],[-56,-28],[-70,-54],[-78,-18],[-82,12]],[[-12,72],[36,68],[72,55],[102,50],[135,60],[158,45],[126,18],[88,8],[54,24],[34,8],[16,36],[-10,36],[-12,72]],[[-18,34],[44,34],[52,12],[34,-35],[18,-35],[5,-12],[-12,4],[-18,34]],[[112,-10],[154,-12],[154,-42],[120,-44],[112,-10]],[[-180,-64],[180,-64],[180,-82],[-180,-82],[-180,-64]]];function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function wrap(lon){return((lon+540)%360)-180}function norm(o){return{id:String(o.id||'node'),lat:clamp(+o.lat||0,-90,90),lon:wrap(+o.lon||0),temperature:+(o.temperature??o.temp??288),vx:+(o.vx||0),vy:+(o.vy||0),vz:+(o.vz||0),charge:+(o.charge??o.q??0),quality:clamp(+(o.quality??1),0,1),phase:+(o.phase??Math.random()),timestamp:+(o.timestamp??Date.now())}}function latest(){const m=new Map;for(const e of buf)m.set(e.id,e);return[...m.values()]}function emit(){const i=buf.length,s=seeds[i%seeds.length],t=Date.now()/1e3;push(norm({id:s[0],lat:s[1]+Math.sin(t*.13+i*.19)*(4+i%7*.08),lon:s[2]+Math.cos(t*.11+i*.17)*9,temperature:s[3]+3*Math.sin(t*.2+i),vx:.5*Math.cos(t+i),vy:.5*Math.sin(t*.7+i),vz:.1*Math.sin(t*.3),charge:s[4]+.12*Math.sin(t+i*.3),quality:.75+.25*Math.abs(Math.sin(t*.5))}))}function push(e){buf.push(e);if(buf.length>2000)buf=buf.slice(-2000)}function inv(events){let k=0,th=0,en=0,cu=0;for(const e of events){let v2=e.vx*e.vx+e.vy*e.vy+e.vz*e.vz;k+=.5*v2;th+=e.temperature;en+=Math.log(1+Math.abs(e.temperature-273)+v2+Math.abs(e.charge));cu+=Math.sin(e.lat*DEG)*e.vy-Math.cos(e.lon*DEG)*e.vx+.1*e.charge}let n=Math.max(1,events.length),T=th/n;return{L:Math.max(0,k+Math.max(0,T-273)*.02),E:en/n,C:cu/n}}function proj(lat,lon,w,h){lat=clamp(lat,-89.9,89.9);lon=wrap(lon-view.lon);let mode=$('proj').value;if(mode==='mercator'){let x=(lon+180)/360*w,y=h/2-w*Math.log(Math.tan(Math.PI/4+lat*DEG/2))/TAU;return[w/2+(x-w/2)*view.zoom,h/2+(y-h/2)*view.zoom,true]}if(mode==='ortho'){let l=lon*DEG,p=lat*DEG,p0=view.lat*DEG,cosc=Math.sin(p0)*Math.sin(p)+Math.cos(p0)*Math.cos(p)*Math.cos(l),r=Math.min(w,h)*.43*view.zoom;return[w/2+r*Math.cos(p)*Math.sin(l),h/2-r*(Math.cos(p0)*Math.sin(p)-Math.sin(p0)*Math.cos(p)*Math.cos(l)),cosc>=-.04]}let x=(lon+180)/360*w,y=(90-lat)/180*h;return[w/2+(x-w/2)*view.zoom,h/2+(y-h/2)*view.zoom,true]}function fieldVal(lat,lon,events,t,mode){let out=0,gain=+$('gain').value/100;for(const e of events){let dlat=(lat-e.lat)*DEG,dlon=(lon-e.lon)*DEG,inf=Math.exp(-(dlat*dlat+dlon*dlon)*280)*e.quality,wave=Math.sin(t*.00025+e.phase*TAU+4*Math.sin((lon-e.lon)*DEG));let v2=e.vx*e.vx+e.vy*e.vy+e.vz*e.vz;if(mode==='thermal')out+=inf*(e.temperature-273);else if(mode==='kinetic')out+=inf*v2;else if(mode==='curl')out+=inf*(e.vy*Math.sin(lon*DEG)-e.vx*Math.cos(lat*DEG)+e.charge*wave);else if(mode==='entropy')out+=inf*Math.log(1+Math.abs(e.temperature-273)+v2);else out+=gain*inf*(wave+e.charge*.35)}return Math.tanh(out/2+.35*Math.sin(lon*DEG*3+t*.00008)*Math.cos(lat*DEG*2))}function color(v){v=clamp((v+1)/2,0,1);return`rgba(${20+235*v**1.7|0},${80+150*Math.sin(v*Math.PI)|0},${120+120*(1-v)|0},.34)`}function resize(){let r=c.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);if(c.width!==r.width*d||c.height!==r.height*d){c.width=r.width*d;c.height=r.height*d}}function draw(now){resize();let w=c.width,h=c.height,events=latest(),I=inv(events);ctx.clearRect(0,0,w,h);let g=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*.7);g.addColorStop(0,'#0c2832');g.addColorStop(1,'#010407');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(let y=0;y<48;y+=2){let lat=90-(y+.5)/48*180;for(let x=0;x<96;x+=2){let lon=(x+.5)/96*360-180,[px,py,v]=proj(lat,lon,w,h);if(!v)continue;ctx.fillStyle=color(fieldVal(lat,lon,events,now,$('layer').value));ctx.fillRect(px-6,py-6,12,12)}}ctx.strokeStyle='#a4f5ff28';for(let lon=-180;lon<=180;lon+=30){ctx.beginPath();let st=false;for(let lat=-90;lat<=90;lat+=3){let[pX,pY,v]=proj(lat,lon,w,h);if(!v){st=false;continue}if(!st){ctx.moveTo(pX,pY);st=true}else ctx.lineTo(pX,pY)}ctx.stroke()}for(let lat=-60;lat<=60;lat+=30){ctx.beginPath();let st=false;for(let lon=-180;lon<=180;lon+=3){let[pX,pY,v]=proj(lat,lon,w,h);if(!v){st=false;continue}if(!st){ctx.moveTo(pX,pY);st=true}else ctx.lineTo(pX,pY)}ctx.stroke()}ctx.fillStyle='#73a89130';ctx.strokeStyle='#b4ffda66';for(const blob of land){ctx.beginPath();let st=false;for(const [lo,la]of blob){let[x,y,v]=proj(la,lo,w,h);if(!v)continue;if(!st){ctx.moveTo(x,y);st=true}else ctx.lineTo(x,y)}if(st){ctx.closePath();ctx.fill();ctx.stroke()}}for(const e of events){let[x,y,v]=proj(e.lat,e.lon,w,h);if(!v)continue;let r=8+8*Math.sin(now*.006+e.phase*TAU)**2;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle='#87f8ff33';ctx.fill();ctx.strokeStyle=e.charge>=0?'#ffd08a':'#ff9bd5';ctx.stroke();ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(Math.atan2(e.vy,e.vx))*32,y+Math.sin(Math.atan2(e.vy,e.vx))*32);ctx.stroke();ctx.fillStyle='#e9fbff';ctx.font='11px ui-sans-serif';ctx.fillText(e.id,x+r+4,y-r)}$('events').textContent=buf.length;$('energy').textContent=I.L.toFixed(3);$('entropy').textContent=I.E.toFixed(3);$('curl').textContent=I.C.toFixed(3);requestAnimationFrame(draw)}function parseND(s){for(const line of s.split(/\n/).map(x=>x.trim()).filter(Boolean)){try{push(norm(JSON.parse(line)))}catch(e){}}}setInterval(()=>{if(running){let n=Math.ceil(rate/6);for(let i=0;i<n;i++)emit()}},166);$('rate').oninput=()=>{rate=+$('rate').value;$('rateText').textContent=rate+' Hz'};$('gain').oninput=()=>$('gainText').textContent=(+$('gain').value/100).toFixed(2);$('pause').onclick=()=>{running=!running;$('pause').textContent=running?'Pause':'Resume'};$('ingest').onclick=()=>parseND($('nd').value);$('geo').onclick=()=>{if(geoWatch){navigator.geolocation.clearWatch(geoWatch);geoWatch=null;return}if(navigator.geolocation)geoWatch=navigator.geolocation.watchPosition(p=>push(norm({id:'browser-geolocation',lat:p.coords.latitude,lon:p.coords.longitude,quality:.9,temperature:288,charge:.05}))) };c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,lon:view.lon,lat:view.lat}};c.onpointermove=e=>{if(!drag)return;view.lon=drag.lon-(e.clientX-drag.x)*.28/view.zoom;view.lat=clamp(drag.lat+(e.clientY-drag.y)*.18/view.zoom,-80,80)};c.onpointerup=()=>drag=null;c.onwheel=e=>{e.preventDefault();view.zoom=clamp(view.zoom*Math.exp(-e.deltaY*.001),.75,5)};requestAnimationFrame(draw);
</script></body></html>
