<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prime Radi Tourbillon Engine</title>
    <style>
      :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f4f1ff;background:#06040c}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:radial-gradient(circle at 50% 12%,#201546 0%,#080611 42%,#020104 100%)}#app{position:fixed;inset:0}.hud{position:fixed;left:18px;top:18px;max-width:470px;padding:16px 18px;border:1px solid rgba(255,255,255,.14);border-radius:18px;background:rgba(5,4,12,.68);backdrop-filter:blur(16px);box-shadow:0 20px 80px rgba(0,0,0,.35)}h1{font-size:18px;margin:0 0 6px;letter-spacing:.04em}.sub{font-size:12px;line-height:1.45;color:#c7bfff}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.metric{padding:8px;border-radius:10px;background:rgba(255,255,255,.07);font-size:11px}.metric b{display:block;font-size:13px;color:#fff}.controls{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;width:min(360px,calc(100vw - 36px));padding:14px;border:1px solid rgba(255,255,255,.14);border-radius:18px;background:rgba(5,4,12,.68);backdrop-filter:blur(16px)}label{font-size:11px;color:#d8d1ff;display:grid;gap:3px}input[type=range]{width:100%}.badge{display:inline-block;padding:2px 7px;border-radius:99px;background:rgba(143,132,255,.18);color:#ddd7ff;font-size:11px;margin-right:5px}</style>
  </head>
  <body>
    <div id="app"></div>
    <section class="hud">
      <h1>Prime Radi Tourbillon Propeller Clock</h1>
      <div class="sub">
        <span class="badge">compute turn</span><span class="badge">uv grid</span><span class="badge">mechanics</span><span class="badge">thermo</span><br/>
        Prime-indexed propeller clock and Möbius/Dyson coil field. Scientific guardrails are toy invariants for visualization, not physical prediction.
      </div>
      <div class="metrics" id="metrics"></div>
    </section>
    <section class="controls">
      <label>Prime torque <input id="torque" type="range" min="0" max="4" step="0.01" value="1.2"></label>
      <label>Thermal bath <input id="thermal" type="range" min="0.01" max="2.5" step="0.01" value="0.55"></label>
      <label>UV curvature <input id="curvature" type="range" min="0" max="3" step="0.01" value="1.1"></label>
      <label>Standard-model mix <input id="smMix" type="range" min="0" max="1" step="0.01" value="0.42"></label>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
